[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gptch-search-gateway"
version = "0.5.0"
description = "Local, read-only Chinese community search gateway for MCP clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "defusedxml>=0.7,<0.8",
  "qrcode[pil]>=8,<9",
  "filelock>=3.16,<4",
  "platformdirs>=4,<5",
  "psutil>=6,<8",
  "scrapling[fetchers]==0.5",
  "playwright>=1.55,<2",
]

[project.scripts]
gptch-search = "personal_search.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/personal_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
